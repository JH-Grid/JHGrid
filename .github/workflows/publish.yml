name: Publish to npm

# Fires when a version tag (v0.1.1, v0.1.2, ...) is pushed -- the same tag push that already
# moves jsDelivr's @latest, so one `git push origin vX.Y.Z` now does both.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
